openapi: 3.1.0

info:
  title: Tibetan-English-Sanskrit Dictionary API
  description: >
    REST backend for the Tibetan-English-Sanskrit Dictionary application.
  version: 1.0.0

servers:
  - url: https://dictionary.christian-steinert.de/backend/api
    description: Production server for the dictionary backend.
# Shared parameter definitions
# ---------------------------------------------------------------------------
components:
  parameters:
    offset:
      name: offset
      in: query
      description: Zero-based pagination offset.
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0

    maxResults:
      name: maxResults
      in: query
      description: Maximum number of results to return (clamped to 1–500).
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50

    dictionaries:
      name: dictionaries
      in: query
      description: >
        Comma-separated list of dictionary names to restrict results to.
        Example: `dictionaries=RangjungYeshe,Berzin`
        Omit entirely to search all dictionaries.
      required: false
      schema:
        type: string

  schemas:
    TermResult:
      type: object
      description: >
        Map of dictionary name → definition text.
        Multiple entries for the same dictionary are separated by `\n-----\n`.
        The definition texts are raw plain text, **not HTML**; see
        `FtsSearchResult.definition` for the markup they may contain.
      additionalProperties:
        type: string
      example:
        RangjungYeshe: "happiness, bliss"
        Berzin: "happiness"

    TermListRow:
      type: object
      required: [term]
      properties:
        term:
          type: string
          description: A matching term in the dictionary.
      example:
        term: "bde ba"

    FtsSearchResult:
      type: object
      description: >
        One fulltext search hit.


        Text fields and their markup:

        - `term`, `definition`: raw text from the dictionary, not
          HTML-escaped — escape before inserting into HTML.

        - `highlightedTerm`, `snippet`: HTML fragments. The text is
          HTML-escaped and the only tags are `<em>…</em>` highlights,
          so they can be inserted into HTML as-is.

        - `{…}`: Tibetan (Wylie) passages inside otherwise non-Tibetan text
          are enclosed in curly braces, in `definition` and `snippet`.
          In purely Tibetan dictionaries, Wylie text is usually not marked.


        Highlighting works only for a plain, case-insensitive text match of the
        search words; it does not take stemming into account. A row that matched
        only through stemming (e.g. a search for `teaching` that found
        `teaches`) therefore has no highlight, and since the search word
        doesn't literally occur in its definition, its snippet consists of
        the term only (`isSnippetAbbreviated` is `true`).
      required: [term, highlightedTerm, dictionary, dictionaryId, snippet, definition, lang, isSnippetAbbreviated]
      properties:
        term:
          type: string
          description: The searched headword as stored in the dictionary.
        highlightedTerm:
          type: string
          description: >
            The term as an HTML fragment: HTML-escaped, with matched words
            wrapped in `<em>…</em>` tags. Equals the escaped `term` if no
            words could be highlighted.
        dictionary:
          type: string
          description: Human-readable dictionary name.
        dictionaryId:
          type: integer
          description: >
            Internal numeric ID of the dictionary. A dictionary that covers
            several languages has a separate ID per language (e.g. `Berzin`
            for `bo` and for `en`). IDs are assigned when the database is
            built and may change between builds — use `dictionary` to
            identify a dictionary permanently.
        snippet:
          type: string
          description: >
            Short excerpt from the definition as an HTML fragment: the first
            match with surrounding context, HTML-escaped, with the match
            wrapped in `<em>…</em>`. May start/end with `…`. `[sound:…]`
            tags, `-----` separators and literal `\n` sequences are
            replaced or removed; `{…}` Wylie blocks may be truncated but are kept 
            balanced. If only the term matched, the snippet is built from the term
            (wrapped in `{…}` for Tibetan headwords).
        definition:
          type: string
          description: >
            Full definition text, raw (not HTML-escaped). Besides `{…}`
            Wylie blocks it may contain line breaks, literal `\n`
            sequences, `-----` separators between sub-entries, embedded
            audio references like `[sound:file.mp3]`, and characters such
            as `<` and `&` used as plain text by some dictionaries.
        lang:
          type: string
          enum: [bo, en, sa]
          description: >
            The language of the dictionary entry's headword. Because
            fulltext search now returns results across all languages
            (definitions are searched globally), each row carries the
            language of its source entry so the frontend can format
            the term column correctly.
        isSnippetAbbreviated:
          type: boolean
          description: >
            `true` when the snippet is only a portion of the full
            definition text. `false` when the snippet already contains
            the entire definition.

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message.

# ---------------------------------------------------------------------------
# Endpoints
# ---------------------------------------------------------------------------
paths:

  /term/{lang}/{term}:
    get:
      operationId: getTerm
      summary: Look up definitions for a specific term
      description: >
        Returns all definitions for the given term across the selected dictionaries.
      parameters:
        - name: lang
          in: path
          required: true
          description: The language of the term (`bo` = Tibetan, `en` = English, `sa` = Sanskrit).
          schema:
            type: string
            enum: [bo, en, sa]
          example: "bo"
        - name: term
          in: path
          required: true
          description: The term to look up (Wylie transliteration for Tibetan, IAST for Sanskrit).
          schema:
            type: string
          example: "bde ba"
        - $ref: '#/components/parameters/dictionaries'
      responses:
        '200':
          description: Map of dictionary name → definition text (may be empty if no entries found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TermResult'
        '400':
          description: Missing or invalid parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /terms/{lang}/{term}:
    get:
      operationId: searchTerms
      summary: Prefix-based term search (auto-complete)
      description: >
        Returns a paginated, alphabetically sorted list of terms that match
        or start with the given search string.


        The matching rules are as follows. **Without wildcards** the comparison is exact and case-sensitive:

        - Tibetan (`bo`): matching is by whole syllables. A term matches if
          it equals the search string or continues with a space after it,
          e.g. `cho` finds `cho` and `cho 'brang`, but not `chos`.

        - English (`en`) and Sanskrit (`sa`): plain character prefix, e.g.
          `compass` finds `compass` and `compassion`. Terms are stored in
          lowercase, so the search string should be lowercase too.


        **With wildcards** (`*` = any sequence of characters, including
        none; `?` = exactly one character) the search is case-insensitive
        for ASCII letters. Unless the search string ends with `*`, a match
        may continue after the end of the pattern:

        - Tibetan: only at a syllable boundary, e.g. `ch?s` finds `chas`,
          `chos` and `chos sku`, but not `chosx`.

        - English and Sanskrit: with any characters, e.g. `ch?s` finds
          `chase`, `chasm` and `chasing after`.


        `?` must be URL-encoded as `%3F` in the path.
      parameters:
        - name: lang
          in: path
          required: true
          description: The language of the term (`bo` = Tibetan, `en` = English, `sa` = Sanskrit).
          schema:
            type: string
            enum: [bo, en, sa]
          example: "bo"
        - name: term
          in: path
          required: true
          description: The query to look up (Wylie transliteration for Tibetan, IAST for Sanskrit).
          schema:
            type: string
          example: "bde ba"
        - $ref: '#/components/parameters/dictionaries'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/maxResults'
      responses:
        '200':
          description: Array of matching terms.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TermListRow'
        '400':
          description: Missing or invalid parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /check-terms/{lang}:
    post:
      operationId: checkTerms
      summary: Check which terms exist in the dictionary
      description: >-
        Accepts a map of external ID → term strings.
        Returns the external IDs of those terms that exist in the
        dictionary. The frontend uses the returned IDs to filter Tibetan sections in a definition
        to decide which portions of a definition to render as clickable links.
        Note: theoretically the caller could use IDs that are identical to the terms to be checked as in 
        "bde ba" -> "bde ba" if the goal is to simply check which terms exist in the dictionary without 
        any particular need to tie an external ID to a specific term.
      parameters:
        - name: lang
          in: path
          required: true
          description: The language of the terms to be checked (`bo` = Tibetan, `en` = English, `sa` = Sanskrit).
          schema:
            type: string
            enum: [bo, en, sa]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Map of external ID → term string.
              additionalProperties:
                type: string
            example:
              section_1: "bde ba"
              section_2: "xyz_nonexistent"
      responses:
        '200':
          description: Array of external IDs whose term exists in the dictionary.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example: ["section_1"]
        '400':
          description: Invalid language, or invalid or missing request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /fulltext/{lang}/{term}:
    get:
      operationId: fulltextSearch
      summary: FTS5-based fulltext search across definitions
      description: >
        Searches definitions (and terms) using SQLite FTS5. Supports FTS5
        query syntax: `AND`, `OR`, `NOT`, `NEAR`, quoted phrases, and
        prefix matching. Results are ordered by FTS5 relevance rank.
        Each result includes a highlighted snippet.

        `xyz*` = any characters at the end of the word, 
        `"abc def"` = phrase search

        Words are compared after reduction by an English stemmer, so
        inflected forms match each other (e.g. `teaching` also finds
        `teachings`). The stemmer is applied to all text, including Wylie,
        which can produce unexpected matches: `compassion` also finds
        `compass`, and `cho` also finds `chos`.

        Term matches are restricted to the requested language, while
        definition matches are returned from the definitions of all languages.  
        Each result contains a `lang` field indicating the headword language.
      parameters:
        - name: lang
          in: path
          required: true
          description: The language of the term (`bo` = Tibetan, `en` = English, `sa` = Sanskrit).
          schema:
            type: string
            enum: [bo, en, sa]
          example: "bo"
        - name: term
          in: path
          required: true
          description: The query to look up (Wylie transliteration for Tibetan, IAST for Sanskrit).
          schema:
            type: string
          example: "bde ba"
        - $ref: '#/components/parameters/dictionaries'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/maxResults'
      responses:
        '200':
          description: Array of fulltext search results with snippets, ordered by relevance (may be empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FtsSearchResult'
        '400':
          description: Missing or invalid parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
