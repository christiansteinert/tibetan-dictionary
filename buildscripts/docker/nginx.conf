# nginx configuration for the Tibetan Dictionary runtime container.
#
# - Serves the Vite-built static files from /var/www/html/
# - Forwards *.php requests to php-fpm listening on 127.0.0.1:9000
# - Sets appropriate cache headers for static assets

worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Compress text responses
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm font/woff2;
    gzip_min_length 1024;

    server {
        listen       80;
        server_name  _;

        root   /var/www/html;
        index  index.html;

        # ── Static assets: long-lived cache (Vite fingerprints filenames) ─────
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ── PHP backend (api.php, snippet.php) ───────────────────────────────
        # PHP files live in /var/www/backend (separate from the static dist)
        # so they are not hidden by the dist bind mount.
        location ~ \.php$ {
            root /var/www/backend;
            try_files $uri =404;
            fastcgi_pass  127.0.0.1:9000;
            fastcgi_index index.php;
            include       fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/backend$fastcgi_script_name;
        }

        # ── SPA fallback: unknown paths → index.html (React Router handles them)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
