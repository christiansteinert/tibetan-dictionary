# nginx configuration for the Tibetan Dictionary runtime container.
#
# - Serves the Vite-built static files from /var/www/html/
# - Forwards *.php requests to php-fpm listening on 127.0.0.1:9000
# - Sets appropriate cache headers for static assets

worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Compress text responses
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm font/woff2;
    gzip_min_length 1024;

    server {
        listen       80;
        server_name  _;

        root   /var/www/html;
        index  index.html;

        # ── Static assets: long-lived cache (Vite fingerprints filenames) ─────
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ── REST API (/api/*) → api.php ────────────────────────────────────────
        # Clean URL style:   /api/term/bde+ba
        # Script style:      /api.php/term/bde+ba  (handled by the .php block below)
        # PATH_INFO is not set here; api.php strips the /api prefix from REQUEST_URI.
        location /backend/api/ {
            fastcgi_pass  127.0.0.1:9000;
            include       fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/backend/api.php;
        }

        # ── PHP backend (api.php, snippet.php, …) ────────────────────────────
        # PHP files live in /var/www/html/backend (separate from the static dist)
        # so they are not hidden by the dist bind mount.
        # fastcgi_split_path_info enables /api.php/term/… style PATH_INFO URLs.
        location ~ ^(?<script_name>.+\.php)(?<path_info>/.*)? {
            root /var/www/html/backend;
            try_files $script_name =404;
            fastcgi_pass  127.0.0.1:9000;
            fastcgi_index index.php;
            include       fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/backend$script_name;
            fastcgi_param PATH_INFO       $path_info;
        }

        # ── SPA fallback: unknown paths → index.html (React Router handles them)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
