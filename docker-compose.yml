# ── Tibetan Dictionary – Docker Compose ───────────────────────────────────────
## ──────────────────────────────────────────────────────────────────────────────

services:

  # Build dictionary databases
  build-db:
    image: python:3.13-slim
    working_dir: /app
    environment:
      DEBIAN_FRONTEND: noninteractive
    command: >-
      sh -c "
        apt-get update -qq &&
        apt-get install -y --no-install-recommends sqlite3 dash > /dev/null &&
        sh buildscripts/buildDictionaries.sh
      "
    volumes:
      - ./backend:/app/backend
      - ./_input:/app/_input
      - ./buildscripts:/app/buildscripts:ro

  # Build react frontend and it into ./webapp/dist
  build-webapp:
    image: node:22-alpine
    working_dir: /app/webapp
    command: |
      sh -c " 
        rm -rf /app/webapp/dist/* 2>/dev/null;
        npm ci --legacy-peer-deps &&
        npm run build &&
        npm run test"
    volumes:
      - ./webapp:/app/webapp:ro
      - ./webapp/dist:/app/webapp/dist
      - ./backend:/app/backend:ro
      - react_node_modules:/app/webapp/node_modules

  # Android APK builder
  # Requirements:
  #   - Run build-db first so backend/TibetanDictionary.db exists
  #   - Place your APK signing keystore at _build/my-release-key.keystore
  #     (see the comment in _build/buildAndroid.sh for keytool instructions).
  build-android:
    build:
      context: .
      dockerfile: buildscripts/docker/android/Dockerfile
    volumes:
      # APK output lands in the project root
      - .:/app
      # backend DB is read-only input for the Android build to make database files available
      - ./backend:/app/backend:ro
    environment:
      # Override these if your SDK is installed in a non-standard location
      # inside the container (the Dockerfile sets ANDROID_HOME=/opt/android-sdk)
      - ANDROID_HOME=/opt/android-sdk
      - JAVA_HOME=/opt/java/openjdk

  # run the backend part of the app for development
  backend-dev:
    image: php:8.3-fpm-alpine
    working_dir: /var/www/html
    command: >-
      sh -c "
        apk add --no-cache nginx &&
        sed -i 's|^listen = .*|listen = 127.0.0.1:9000|' /usr/local/etc/php-fpm.d/www.conf &&
        php-fpm -D &&
        nginx -c /etc/nginx/tibetandict.conf -g 'daemon off;'
      "
    ports:
      - "8080:80"
    restart: unless-stopped
    volumes:
      - ./backend/:/var/www/html/backend:ro
      # nginx config
      - ./buildscripts/docker/deploy/nginx.conf:/etc/nginx/tibetandict.conf:ro

  # Run the backend tests
  backend-test:
    image: python:3.12-slim
    working_dir: /backend-tests
    depends_on:
      - backend-dev
    command: >-
      sh -c "
        pip install --no-cache-dir requests && 
        sleep 10 &&  # Wait for backend-dev to be up and running
        python3 ./backend-test.py
      "
    expose: 
      - "80"
    ports:
      - "8080:80"
    restart: unless-stopped
    volumes:
      - ./backend/tests/:/backend-tests:ro



  # Run the frontend tests 
  frontend-test:
    image: node:22-alpine
    working_dir: /app/webapp
    command: sh -c "npm ci --legacy-peer-deps && npm run test"
    ports:
      - "5173:5173"
    volumes:
      - ./webapp:/app/webapp:ro
      - react_node_modules:/app/webapp/node_modules
    environment:
      - BACKEND_URL=http://backend-dev:80


  # Run the frontend part of the application with hot reload for development
  frontend-dev:
    image: node:22-alpine
    working_dir: /app/webapp
    command: sh -c "npm ci --legacy-peer-deps && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./webapp:/app/webapp:ro
      - react_node_modules:/app/webapp/node_modules
    environment:
      - BACKEND_URL=http://backend-dev:80


volumes:
  # Persists node_modules across frontend / build-webapp runs so npm ci is fast after
  # the first run (only re-installs when package-lock.json changes).
  react_node_modules:

