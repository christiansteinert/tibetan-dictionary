name: Test Suite

on:
  pull_request:
    branches:
      - main
      - master
      - feature/react-migration
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    if: |
      contains(github.event.pull_request.labels.*.name, 'run_tests') ||
      github.event_name == 'workflow_dispatch' ||
      github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Remove Label
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run_tests')
        continue-on-error: true  # fork PRs have a read-only token; label removal will fail silently
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --remove-label "run_tests"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'webapp/package-lock.json'

      - name: Install Dependencies
        working-directory: webapp
        run: npm ci

      - name: Run Tests
        working-directory: webapp
        run: npm run test
